name: Windows build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Get source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"
          cache: "pip"

      - name: Install build packages
        shell: pwsh
        run: python -m pip install -r requirements-dev.txt

      - name: Build Latencia.exe
        shell: pwsh
        run: pyinstaller Latencia.spec --noconfirm --clean

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: pwsh
        run: ISCC.exe installer\Latencia.iss

      - name: Copy portable app
        shell: pwsh
        run: Copy-Item dist\Latencia.exe release\Latencia.exe

      - name: Upload Windows files
        uses: actions/upload-artifact@v4
        with:
          name: Latencia-Windows
          path: |
            release/Latencia.exe
            release/Latencia-Setup.exe
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" release\Latencia.exe release\Latencia-Setup.exe --title "Latencia ${{ github.ref_name }}" --generate-notes
